name: bundle

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install && pnpm build
      - name: Only keep 角色卡示例 in dist for template upstream
        if: github.repository == 'StageDog/tavern_helper_template'
        run: |
          mv dist/角色卡示例 角色卡示例
          rm -rf dist
          mkdir dist
          mv 角色卡示例 dist/
      - name: Remove 示例 in dist for templated repository
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'

      # 上游模板在这里有一组 autotag 步骤：每次 push 自动递增版本 tag，
      # 并 `git push --delete` 掉上一个 —— 目的是让 jsdelivr 按版本号缓存。
      #
      # 本项目已移除该机制，原因有二：
      #   1. 蔷薇前端以单文件脚本分发，代码内联在 JSON 里，不走 jsdelivr，
      #      也没有任何运行期 CDN 依赖（见 pack-script.mjs 的产物检查）。
      #   2. 「删除上一个 tag」会连带删掉 release 所指向的 tag。发布 v1.0.0
      #      之后随便推一次代码，release 就会指向一个不存在的 tag。
      #
      # 版本号的唯一来源是 domain/plugin-license.ts 的 PLUGIN_VERSION，
      # tag 由发布时手动打，不再自动生成。
